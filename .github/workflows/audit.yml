name: Audit (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT }}
          SITE_URL: ${{ vars.SITE_URL }}
          # No NOINDEX here: the audit gates prod-mode quality (Lighthouse's SEO
          # is-crawlable audit fails on noindex pages by design). Only deploy.yml
          # builds with NOINDEX for the staging artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  validate-sitemap:
    name: Validate sitemap
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Check sitemap exists, is valid XML, and lists URLs
        run: |
          test -f dist/sitemap-index.xml || { echo "sitemap-index.xml missing"; exit 1; }
          xmllint --noout dist/sitemap-index.xml
          if [ -f dist/sitemap-0.xml ]; then
            xmllint --noout dist/sitemap-0.xml
            grep -q '<loc>' dist/sitemap-0.xml || { echo "sitemap-0.xml has no <loc> entries"; exit 1; }
          fi
          echo "Sitemap structure valid"

  validate-links:
    name: Check links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Self-domain URLs are build-generated canonicals/og:urls/redirect targets —
          # their paths are validated as internal links via --root-dir, and fetching
          # them over the network 404s until DNS cutover. Formspree rejects HEAD (405);
          # the endpoint is POST-only by design.
          args: >-
            --root-dir "${{ github.workspace }}/dist"
            --accept 200,202,301,302,403,429
            --exclude '^https://(staging\.)?treatyourselfstudios\.net'
            --exclude '^https://formspree\.io'
            --no-progress --max-concurrency 8 'dist/**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
